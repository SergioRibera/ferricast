[workspace]
resolver = "2"
members = [
    ".",
    "crates/core",
    "crates/codec",
    "crates/nvcodec",
    "crates/capture",
    "crates/chromecast",
    "crates/airplay",
    "crates/fairplay",
    "crates/miracast",
    "crates/encoder",
    "crates/decoder",
    "crates/demuxer",
    "crates/player",
    "crates/m3u8",
    "crates/muxer",
    "crates/hls",
    "crates/dbus",
    "crates/gui",
]

# Shared by every member through `[lints] workspace = true`;
# `ferricast-codec` keeps its own, stricter table.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "warn"
allow_attributes_without_reason = "deny"

[workspace.dependencies]
ferricast = { path = ".", default-features = false }
ferricast-core = { path = "crates/core" }
ferricast-codec = { path = "crates/codec" }
ferricast-nvcodec = { path = "crates/nvcodec" }
ferricast-capture = { path = "crates/capture", default-features = false }
ferricast-chromecast = { path = "crates/chromecast", default-features = false }
ferricast-encoder = { path = "crates/encoder", default-features = false }
ferricast-decoder = { path = "crates/decoder", default-features = false }
ferricast-demuxer = { path = "crates/demuxer" }
ferricast-m3u8 = { path = "crates/m3u8" }
ferricast-muxer = { path = "crates/muxer" }
ferricast-hls = { path = "crates/hls" }
ferricast-dbus = { path = "crates/dbus" }
ferricast-airplay = { path = "crates/airplay" }
# GPL-3.0-or-later; only pulled in through the `airplay` feature below.
ferricast-fairplay = { path = "crates/fairplay" }
ferricast-miracast = { path = "crates/miracast", default-features = false }

tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "2"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
# 5.19 picks the executor per call when both `tokio` (ours) and `async-io`
# (Freya's theme watcher, mundy) are enabled; older releases always used
# tokio and panicked on mundy's thread, which has no tokio runtime.
zbus = { version = "5.19", features = ["tokio"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
async-trait = "0.1"
mdns-sd = "0.22"

[package]
name = "ferricast"
version = "0.1.0"
edition = "2024"
description = "Unified screen and video streaming library for Linux"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = [
    "chromecast",
    "pipewire",
    "wlroots",
    "wayland-direct",
    "openh264",
    "vaapi",
    "nvenc",
    "nvdec",
    "aac",
    "airplay",
    "fdk-aac",
    "opus-rs",
    "hevc-decode",
    "vp8-decode",
    "vp9-decode",
    "av1-decode",
    "opus-decode",
    "media-foundation",
    "videotoolbox",
    "audiotoolbox",
    "mediacodec",
]
chromecast = ["dep:ferricast-chromecast"]
# AirPlay sender. Also enables FairPlay `fp-setup` support, which links the
# GPL-3.0-or-later `ferricast-fairplay` crate; drop `ferricast-airplay/fairplay`
# here to build without it.
airplay = [
    "dep:ferricast-airplay",
    "ferricast-airplay/fairplay",
    "ferricast-decoder/alac-decode",
]


# Capture backends — re-exported from `ferricast-capture`. At least
# one MUST be enabled; the capture crate emits a `compile_error!` if
# both are turned off.
pipewire = ["ferricast-capture/pipewire"]

# Encoder backends — re-exported from `ferricast-encoder`. At least
# one MUST be enabled (the encoder crate emits a `compile_error!`
# when all three are off). Typical escape hatch when cros-libva's
# pinned libva ABI doesn't match the host:
#     ferricast = { default-features = false,
#                   features = ["chromecast", "x11", "pipewire",
#                               "openh264", "nvenc"] }
openh264 = ["ferricast-encoder/x264", "ferricast-decoder/openh264-decode"]
vaapi = ["ferricast-encoder/vaapi", "ferricast-decoder/vaapi-decode"]
nvenc = ["ferricast-encoder/nvenc"]
# HEVC (and HEVC Main10 / HDR10) encode through NVENC.
nvenc-hevc = ["nvenc", "ferricast-encoder/nvenc-hevc"]
# NVIDIA hardware decode for receivers. CUDA is loaded at runtime, so the
# build needs no NVIDIA SDK; without a GPU the decoders fall back to VA-API
# or software.
nvdec = ["ferricast-decoder/nvdec-decode", "ferricast-decoder/nvdec-hevc-decode"]
# Pure-Rust AAC decode for receivers. CPU only (no consumer driver
# does hardware AAC); plenty fast for one stream. Default on so
# `ferricast = "*"` builds with both H.264 and AAC decode wired up.
aac = ["ferricast-decoder/aac"]
# Pure-Rust software decoders the receiver registers for progressive
# media (WebM, MKV, MP4): HEVC, VP8, VP9, AV1 video and Opus audio.
hevc-decode = ["ferricast-decoder/hevc-decode"]
vp8-decode = ["ferricast-decoder/vp8-decode"]
vp9-decode = ["ferricast-decoder/vp9-decode"]
av1-decode = ["ferricast-decoder/av1-decode"]
opus-decode = ["ferricast-decoder/opus-decode"]
# AAC-LC encode via libfdk-aac for the sender side (chromecast HLS
# audio). Requires `libfdk-aac` on the link path — the flake's
# devShell ships it; on Debian/Ubuntu install `libfdk-aac-dev`.
# Without this feature the chromecast audio pipeline starts, captures
# PCM from PipeWire, then dies on the first frame with
# `AacEncoder: no backend compiled in` — video keeps streaming,
# the silent-AAC fallback fills the audio PID so playback continues.
# The same library also decodes on the receiver side, where it adds
# HE-AAC v1/v2 (SBR, PS) at full rate on top of the symphonia AAC-LC
# decoder.
fdk-aac = ["ferricast-encoder/fdk-aac", "ferricast-decoder/fdk-aac-decode"]
# Pure-Rust Opus encoder for Cast Streaming (RTP mirror path).
# No system-library dependency — opus-rs is 100% Rust.
opus-rs = ["ferricast-encoder/opus-rs", "ferricast-chromecast?/opus"]
# Wayland source enumeration (foreign-toplevel + xdg-output).
# Orthogonal to `pipewire`: that's for *capture* on Wayland; this is
# for *picking the source to capture* via an in-process picker
# instead of the portal dialog. Covers wlroots + niri + KDE Plasma 6
# under one feature flag (historical name retained for compat).
wlroots = ["ferricast-capture/wlroots"]
# Wayland direct capture (no xdg-desktop-portal). Streams a
# resolved monitor via `wlr-screencopy`, allocates DMA-BUFs through
# gbm for GPU end-to-end. Falls back to PipeWire/portal at runtime
# if the protocols aren't available.
wayland-direct = ["ferricast-capture/wayland-direct", "wlroots"]
# Platform codecs (see crates/encoder/Cargo.toml). Target-gated, so they
# are inert off their own OS and stay in the defaults.
media-foundation = ["ferricast-encoder/media-foundation", "ferricast-decoder/media-foundation"]
videotoolbox = ["ferricast-encoder/videotoolbox", "ferricast-decoder/videotoolbox"]
audiotoolbox = ["ferricast-encoder/audiotoolbox", "ferricast-decoder/audiotoolbox"]
mediacodec = ["ferricast-encoder/mediacodec", "ferricast-decoder/mediacodec"]
# The codecs as the istmo plugin `ferricast.codec` (see `codec_service`).
# istmo is pre-1.0: its API and wire format may change between releases.
istmo = [
    "ferricast-codec/istmo",
    "ferricast-encoder/istmo",
    "ferricast-decoder/istmo",
]

[dependencies]
ferricast-core.workspace = true
# Capture's default features are turned off at the workspace level
# so the root's `pipewire`/`x11` features fully control which backends
# get compiled in. Otherwise turning off the root features wouldn't
# actually disable them — capture's own defaults would still pull
# them through.
ferricast-capture.workspace = true
ferricast-encoder.workspace = true
ferricast-decoder.workspace = true
ferricast-codec.workspace = true
# Progressive (MP4/WebM/MKV over HTTP) playback for receivers.
ferricast-demuxer = { workspace = true, features = ["http"] }
ferricast-hls.workspace = true
ferricast-airplay = { workspace = true, optional = true }
ferricast-chromecast = { workspace = true, optional = true }
ferricast-miracast.workspace = true

tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
bytes.workspace = true
# The FairPlay vector the loop test checks the receiver against.
ferricast-fairplay.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# HE-AAC test streams: libfdk-aac is the only HE-AAC encoder at hand.
fdk-aac = "0.8"
async-trait.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tempfile = "3"
# Binary plists the AirPlay video test sends and reads.
plist = "1.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Paused clock for the pipeline tests (reconnect backoff, pacing).
tokio = { workspace = true, features = ["test-util"] }

# The NVIDIA end-to-end tests allocate DMA-BUFs with GBM and write them
# with GLES through the support module of ferricast-nvcodec's own tests.
[target.'cfg(target_os = "linux")'.dev-dependencies]
ferricast-nvcodec.workspace = true
libloading = "0.9"
libc = "0.2"

# Optimise hot-path crates in dev: x264/yuv/fdk-aac at opt=0 are
# 5-10× slower and starve the audio pipeline.
[profile.dev.package.yuv]
opt-level = 3
[profile.dev.package.fdk-aac]
opt-level = 3
[profile.dev.package.rav1d]
opt-level = 3
debug-assertions = false
overflow-checks = false

# The receiver decodes, decrypts (AirPlay AES-CTR), colour-converts (core,
# for sinks that want RGB) and paces 1080p60 video in these crates; at
# opt-level 0 they cannot keep up and debug builds drop frames release builds
# show. Dependencies are built once and rarely rebuilt, so optimising them
# costs little. The GUI crate stays unoptimised: it only hands the frames to
# Skia, which converts and scales them on the GPU.
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.ferricast-core]
opt-level = 3
[profile.dev.package.ferricast]
opt-level = 3
[profile.dev.package.ferricast-decoder]
opt-level = 3
[profile.dev.package.ferricast-airplay]
opt-level = 3

# The istmo crates come from a local checkout of istmo next to this one
# (`../istmo/istmo`) while the releases they need are unpublished. Goes
# once those releases are on crates.io.
[patch.crates-io]
istmo-core = { path = "../istmo/istmo/crates/core" }
istmo-macros = { path = "../istmo/istmo/crates/macros" }
