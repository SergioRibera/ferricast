[package]
name = "ferricast-capture"
version = "0.1.0"
edition = "2024"
description = "Screen and audio capture for ferricast over the istmo screen-capture plugin"

[dependencies]
ferricast-core.workspace = true
tokio.workspace = true
tracing.workspace = true
bytes.workspace = true
async-trait = { workspace = true }

# Pre-release: an exact pin, since `0.1` would not match `0.1.1-alpha.7`.
# Every capture backend (wlr-screencopy, ext-image-copy, X11, portal +
# PipeWire, PipeWire audio) lives in the plugin; on platforms it has no
# backend for, it answers `NoBackendCompiled`.
istmo-core = "=0.1.1-alpha.7"
istmo-screen-capture = "=0.1.1-alpha.7"
# Drives the plugin's futures from synchronous constructors (the
# source enumerator's first listing); they complete on any executor.
pollster = "0.4"

# Image encoding for thumbnails. `default-features = false` strips
# every codec except PNG, which is the only one the daemon hands
# back over D-Bus.
image = { version = "0.25", default-features = false, features = ["png"] }

# The Vulkan importer that reads tiled / compressed DMA-BUF frames back
# to CPU memory: the plugin hands DMA-BUFs over and has no readback of
# its own. If `ash::Entry::load()` fails (no loader / driver), capture
# asks the plugin for CPU frames instead.
[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
libc = "0.2.183"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
