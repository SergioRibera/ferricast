[package]
name = "ferricast-decoder"
version = "0.1.0"
edition = "2024"
description = "Receiver-side decoders for ferricast (CPU H.264 + AAC; GPU paths follow)"

[features]
# Decoder backends.
#
# - `openh264-decode` — software H.264 decode. CPU only, always
#   works when compiled in. Today's only video backend; GPU paths
#   (`vaapi-decode`, `nvdec-decode`) are slotted into the facade's
#   auto-select chain in a follow-up — the shape is already there.
# - `aac` — pure-Rust AAC-LC decoder via symphonia. Audio decode is
#   CPU-bound across the board (no consumer driver exposes hardware
#   AAC decode), so one backend covers the receiver pipeline.
default = ["openh264-decode", "aac"]
openh264-decode = ["dep:openh264", "dep:openh264-sys2"]
aac = ["dep:symphonia"]
vp8-decode = ["dep:vp8-decoder"]
vp9-decode = ["dep:rusty_vp9"]
hevc-decode = ["dep:rust_h265", "dep:h264-reader"]
av1-decode = ["dep:rav1d", "dep:libc"]
# Hardware H.264 decode via VA-API. Opt-in (not in defaults) until
# the slice-submission path is fully verified against a real
# bitstream test rig — until then `FERRICAST_H264_DECODE_BACKEND=vaapi`
# is the runtime escape hatch to engage it. Default-off keeps every
# build that turns this feature on at compile time from accidentally
# using a half-validated decode path.
vaapi-decode = ["dep:cros-libva", "dep:h264-reader"]
# VA-API HEVC decode. Sits next to `vaapi-decode` so the two share
# the cros-libva dependency. Opt-in: HEVC decode is part of the
# H.265 facade only.
vaapi-hevc-decode = ["dep:cros-libva"]
# NVDEC hardware decode (NVIDIA). Carries the generic `NvdecDecoder<C>`
# whose codec marker selects H.264 today; the HEVC marker lives
# behind `nvdec-hevc-decode` below.
nvdec-decode = ["dep:shiguredo_nvcodec"]
# NVDEC HEVC decode. Builds on top of `nvdec-decode`; only the codec
# marker is gated, the dispatcher and CUDA plumbing are shared.
nvdec-hevc-decode = ["nvdec-decode"]

[dependencies]
ferricast-core = { path = "../core", default-features = false }
bytes.workspace = true
tracing.workspace = true

openh264 = { version = "0.9.3", optional = true }
# The raw openh264 types: the safe wrapper drops the timestamp openh264
# carries from each input packet to the picture it decodes into.
openh264-sys2 = { version = "0.9", optional = true, default-features = false }
symphonia = { version = "0.5", optional = true, default-features = false, features = ["aac"] }
vp8-decoder = { version = "0.1.2", optional = true, default-features = false }
rusty_vp9 = { version = "0.3", optional = true, default-features = false }
rust_h265 = { version = "0.4.1", optional = true, default-features = false }
rav1d = { version = "1.1", optional = true, default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
libc = { version = "0.2", optional = true }

# VA-API decode (opt-in). Same fork pin as the encoder so a single
# libva ABI version is in play across the workspace.
cros-libva = { git = "https://github.com/SergioRibera/cros-libva", branch = "fix/vp9-encpicparam-fields", optional = true }

# H.264 bitstream parser. Pure-Rust, no system deps. Used by the
# VA-API backend to decode SPS / PPS so the VA buffer construction
# has the bitstream-derived parameters it needs. The software HEVC
# backend borrows its Exp-Golomb bit reader to read picture order counts.
h264-reader = { version = "0.7", optional = true }

# NVDEC binding (same crate the encoder uses — the workspace is
# already pinned to it, so wiring in decode here gets us NV12 output
# from H.264 + HEVC bitstreams without a second NVIDIA library
# dependency).
shiguredo_nvcodec = { version = "2026.1.0", optional = true }

[dev-dependencies]
ferricast-demuxer = { path = "../demuxer" }
