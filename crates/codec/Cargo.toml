[package]
name = "ferricast-codec"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Backend selection, runtime fallback and the istmo plugin surface shared by the ferricast encoders and decoders"

[features]
default = []
# The codecs as an istmo plugin (`ferricast.codec`, see `plugin`):
# capability reports, backend resolution and session control callable
# from any istmo client (Rust, Kotlin, Swift). Frames never cross the
# istmo wire; a session handle opens a direct Rust data path.
istmo = [
    "dep:istmo-core",
    "dep:istmo-macros",
    "dep:flume",
    "ferricast-core/wire",
]
# The Media Foundation plumbing (`mf`) the Windows encoders and decoders
# share. Windows-only dependency; inert elsewhere.
media-foundation = ["dep:windows"]
# The `AMediaCodec` media surfaces (`android`: `AHardwareBuffer` pictures,
# `AImageReader` outputs) the Android encoders and decoders share.
# Android-only dependencies; inert elsewhere.
mediacodec = ["dep:ndk", "dep:ndk-sys", "dep:libc"]

[dependencies]
ferricast-core = { path = "../core", default-features = false }
bytes.workspace = true
tracing.workspace = true

# Pre-release: an exact pin, since `0.1` would not match `0.1.1-alpha.6`.
istmo-core = { version = "=0.1.1-alpha.6", optional = true }
istmo-macros = { version = "=0.1.1-alpha.6", optional = true }
# The channel istmo hosted streams read from (the version istmo-core uses).
flume = { version = "0.11", default-features = false, optional = true }
thiserror.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
# `dlsym` for `AHardwareBuffer_lockPlanes`, which only exists from API 29.
libc = { version = "0.2", optional = true }
ndk = { version = "0.9", default-features = false, features = ["media", "api-level-28"], optional = true }
ndk-sys = { version = "0.6", optional = true }

[lints.rust]
# `deny`, not `forbid`: the Windows `mf` module opts in locally.
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"
todo = "warn"
allow_attributes_without_reason = "deny"

[dev-dependencies]
pollster = "0.4"
