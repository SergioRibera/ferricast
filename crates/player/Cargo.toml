[package]
name = "ferricast-player"
version = "0.1.0"
edition = "2024"
description = "Local video file playback for ferricast"

[features]
default = ["vaapi"]
vaapi = ["ferricast-decoder/vaapi-decode"]

[dependencies]
ferricast-core = { path = "../core", default-features = false }
ferricast-demuxer.workspace = true
ferricast-decoder = { workspace = true, features = ["openh264-decode", "vp8-decode", "vp9-decode", "hevc-decode", "av1-decode"] }
tracing.workspace = true
