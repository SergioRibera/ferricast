[package]
name = "ferricast-airplay"
version = "0.1.0"
edition = "2024"
description = "AirPlay screen-mirroring sender for ferricast"

[features]
default = []
# Run the FairPlay `fp-setup` exchange with a precomputed key message. Pulls
# in the GPL-3.0-or-later `ferricast-fairplay` crate. Without it the sender
# skips `fp-setup`; UxPlay/RPiPlay then fall back to an all-zero base key.
fairplay = ["dep:ferricast-fairplay"]

[dependencies]
ferricast-core.workspace = true
# Plays the HLS URLs AirPlay video senders hand the receiver.
ferricast-hls.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "rt", "macros"] }
tracing.workspace = true
thiserror.workspace = true
bytes.workspace = true
uuid.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mdns-sd.workspace = true
plist = "1.10"
hex = "0.4"
rand = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
num-bigint = "0.4"
sha1 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
aes = "0.8"
ctr = "0.9"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
ferricast-fairplay = { workspace = true, optional = true }
md-5 = "0.10"
# Secret Service / Secret portal client for pairing secrets. 0.6 is the
# newest release on zbus 5, which the rest of the workspace already uses.
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ferricast-encoder = { workspace = true, features = ["x264", "fdk-aac"] }
