[package]
name = "ferricast-airplay"
version = "0.1.0"
edition = "2024"
description = "AirPlay 2 protocol for ferricast"

[dependencies]
ferricast-core.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync"] }
tracing.workspace = true
thiserror.workspace = true
bytes.workspace = true
uuid.workspace = true

hkdf = "0.13.0"
mdns-sd = "0.11"
rustls = { version = "0.23", features = ["ring"] }
httparse = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
bitflags = "2.13.1"
hex = "0.4.3"
plist = "1.10.0"
sha2 = "0.11.0"
byteorder = "1.5.0"
num-bigint = "0.5.1"
num-traits = "0.2.19"
easy-srp = "0.3.0"
ctr = "0.10.1"
aes = "0.9.3"
cipher = "0.5.2"
