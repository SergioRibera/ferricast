[package]
name = "ferricast-miracast"
version = "0.1.0"
edition = "2024"
description = "Miracast (Wi-Fi Display) sender + receiver for ferricast"

[dependencies]
# `net` activates the receiver protocol / push surface the sink needs.
ferricast-core = { workspace = true, features = ["net"] }
tokio = { workspace = true, features = ["net", "io-util", "sync", "process", "time", "rt", "macros"] }
tracing.workspace = true
thiserror.workspace = true
bytes.workspace = true
uuid.workspace = true

httparse = "1"
# Random SSRCs, RTSP session tokens, RTP initial sequence.
rand = "0.8"
# MS-MICE discovery + sink advertisement — portable path, used on
# every platform.
mdns-sd.workspace = true
# MICE control port 7250 + RTP socket tuning (reuseport, rcvbuf).
socket2 = { version = "0.6", features = ["all"] }
futures-util = { workspace = true }

# Linux Wi-Fi Direct via wpa_supplicant D-Bus. Linked only on Linux
# hosts; on other targets the module isn't compiled. Runtime failure
# modes (no P2P-Device iftype, IWD-managed radio, NM-exclusive lock)
# are surfaced via `MiracastHandler::availability()` so callers can
# keep offering the MICE fallback.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

# Windows-native Miracast enumerator via WinRT. `CastingConnection`
# itself has to live in a COM-STA window the GUI owns; this crate
# only surfaces the device list + capability probe.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Casting",
    "Devices_Enumeration",
    "UI_ViewManagement",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
