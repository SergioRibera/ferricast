[package]
name = "ferricast-miracast"
version = "0.1.0"
edition = "2024"
description = "Miracast (Wi-Fi Display) protocol for ferricast"

[dependencies]
ferricast-core.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "process", "time", "fs"] }
tracing.workspace = true
thiserror.workspace = true
bytes.workspace = true
uuid.workspace = true

zbus = { version = "5", features = ["tokio"] }
zvariant = "5"
futures-lite = "2"
rand = "0.8"
