[package]
name = "ferricast-miracast"
version = "0.1.0"
edition = "2024"
description = "Miracast (Wi-Fi Display) sender + receiver for ferricast"

[features]
# Portable path: MS-MICE (Miracast over Infrastructure). Discovered via mDNS,
# runs standard WFD RTSP + MPEG2-TS/RTP over plain TCP/UDP on the LAN. Only
# viable transport on macOS; on Linux/Windows it's the fallback when Wi-Fi
# Direct isn't available.
default = ["mice"]
mice = []
# Wi-Fi Direct via wpa_supplicant D-Bus. Linux-only; the crate falls back
# to MICE when disabled or when the adapter lacks P2P-Device iftype.
linux-p2p = ["dep:zbus"]
# Windows-native Miracast via WinRT (Windows.Media.Casting sender). The
# receiver (MiracastReceiver) is gated behind MSIX packaging and lives
# outside this feature; see the per-platform plan.
windows-native = ["dep:windows"]

[dependencies]
# `net` activates the receiver protocol / push surface the sink needs.
ferricast-core = { workspace = true, features = ["net"] }
tokio = { workspace = true, features = ["net", "io-util", "sync", "process", "time", "rt", "macros"] }
tracing.workspace = true
thiserror.workspace = true
bytes.workspace = true
uuid.workspace = true

httparse = "1"
# Random SSRCs, RTSP session tokens, RTP initial sequence.
rand = "0.8"
# MS-MICE discovery + sink advertisement.
mdns-sd.workspace = true
# MICE control port 7250 + RTP socket tuning (reuseport, rcvbuf).
socket2 = { version = "0.6", features = ["all"] }

# Linux P2P: optional, default-off. Pulled in by the `linux-p2p` feature.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true, optional = true }

# Windows-native sender via WinRT.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Casting",
    "Devices_Enumeration",
    "UI_ViewManagement",
], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
