[package]
name = "ferricast-core"
version = "0.1.0"
edition = "2024"
description = "Core traits and types for ferricast streaming protocols"

[lints]
workspace = true

[features]
default = ["net"]
net = ["dep:tokio", "dep:socket2", "dep:if-addrs", "dep:mdns-sd"]
# wincode derives on the colour, codec and backend types, so the istmo
# codec plugin can carry them across its wire (istmo encodes with wincode).
wire = ["dep:wincode"]
wincode = ["dep:wincode"]

[dependencies]
tokio = { workspace = true, features = ["sync", "macros", "net", "rt", "time"], optional = true }
# Dual-stack (`IPV6_V6ONLY` off) listeners in `net.rs`.
socket2 = { version = "0.6", optional = true }
# Interface subnets for ranking receiver addresses (`net::local_ipv4_subnets`).
if-addrs = { version = "0.13", optional = true }
# Scoped addresses of resolved services (`DeviceAddresses::from_mdns`).
mdns-sd = { workspace = true, optional = true }
tracing.workspace = true
thiserror.workspace = true
bytes.workspace = true
uuid.workspace = true
bitflags = "2.13.1"
async-trait = { workspace = true }
wincode = { version = "0.6", default-features = false, features = ["derive", "std"], optional = true }
# `fstat` for DMA-BUF identity (`DmaBufFd::buffer_id` in `frame/dmabuf.rs`),
# which only exists on Linux and Android.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2.183"
