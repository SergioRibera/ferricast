[package]
name = "ferricast-core"
version = "0.1.0"
edition = "2024"
description = "Core traits and types for ferricast streaming protocols"

[features]
default = ["net"]
net = ["dep:tokio", "dep:socket2"]

[dependencies]
tokio = { workspace = true, features = ["sync", "macros", "net"], optional = true }
# Dual-stack (`IPV6_V6ONLY` off) listeners in `net.rs`.
socket2 = { version = "0.6", optional = true }
tracing.workspace = true
thiserror.workspace = true
bytes.workspace = true
uuid.workspace = true
bitflags = "2.13.1"
async-trait = { workspace = true }
# `fstat` for DMA-BUF identity (`DmaBufFd::buffer_id` in `frame.rs`).
libc = "0.2.183"
