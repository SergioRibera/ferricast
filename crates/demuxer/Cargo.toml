[package]
name = "ferricast-demuxer"
version = "0.1.0"
edition = "2024"
description = "MP4, MOV, WebM and MKV demuxers for ferricast"

[features]
default = ["matroska", "audio-files"]
matroska = ["dep:matroska-demuxer"]
# `ProgressivePuller`: plays a progressive file over HTTP(S) as a
# receiver-side `MediaPuller`, with range requests when the server
# supports them and a temp-file download when it does not.
http = ["dep:reqwest", "dep:tokio", "dep:tempfile"]
# MP3, FLAC, Ogg (Vorbis, Opus) and WAV audio files, read and (but for
# Opus) decoded to PCM through symphonia.
audio-files = ["dep:symphonia"]

[dependencies]
ferricast-core = { path = "../core", default-features = false }
bytes.workspace = true
matroska-demuxer = { version = "0.8", optional = true }
# Same client and TLS backend as the HLS puller, so the workspace
# carries one HTTP stack.
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "http2"] }
tokio = { workspace = true, optional = true }
tempfile = { version = "3", optional = true }
tracing = { workspace = true }
symphonia = { version = "0.5", optional = true, default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
