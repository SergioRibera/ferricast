# Tests may unwrap: a panic is the right failure there. Only crates that
# enable `clippy::unwrap_used` (ferricast-codec) are affected.
allow-unwrap-in-tests = true

# Product and protocol names written as prose in docs, which
# `clippy::doc_markdown` would otherwise want in backticks; `..` keeps
# clippy's defaults (`GitHub`, `macOS`, ...).
doc-valid-idents = [
    "..",
    "AirPlay",
    "AirScreen",
    "AudioToolbox",
    "BubbleUPnP",
    "CASTv2",
    "CoreUtils",
    "FFmpeg",
    "FairPlay",
    "GnuTLS",
    "HomeKit",
    "HomePods",
    "ICtCp",
    "MediaCodec",
    "NACKed",
    "PipeWire",
    "PulseAudio",
    "RPiPlay",
    "ScreenCast",
    "UxPlay",
    "VideoToolbox",
    "WebM",
    "WinRT",
    "XORed",
    "XRandR",
    "YouTube",
]
